name: Deploy platform frontend

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR image reference using a sha256 digest
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: platform-frontend
      image: ${{ inputs.image_ref }}
    secrets: inherit
