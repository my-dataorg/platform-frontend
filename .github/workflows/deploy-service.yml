name: Deploy one service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
    secrets:
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mydata/production' }}
    steps:
      - name: Validate image reference
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [[ "$SERVICE" != "platform-frontend" ]]; then
            echo "This workflow only deploys platform-frontend" >&2
            exit 1
          fi
          if [[ ! "$IMAGE" =~ ^ghcr\.io/my-dataorg/${SERVICE}@sha256:[0-9a-f]{64}$ ]]; then
            echo "Use an immutable GHCR image for $SERVICE" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Prepare service override
        env:
          IMAGE: ${{ inputs.image }}
        run: printf 'PLATFORM_FRONTEND_IMAGE=%s\n' "$IMAGE" > service.env

      - name: Upload service override
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            service.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/service.env.next"

      - name: Pull and restart platform frontend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          [ -f service.env ] && cp service.env service.env.previous || true
          mv service.env.next service.env

          compose() {
            args=(--env-file .env)
            [ -f image.env ] && args+=(--env-file image.env)
            [ -f service.env ] && args+=(--env-file service.env)
            docker compose "${args[@]}" "$@"
          }

          rollback() {
            if [ -f service.env.previous ]; then
              cp service.env.previous service.env
            else
              rm -f service.env
            fi
            compose pull platform-frontend || true
            compose up -d --no-deps platform-frontend || true
            exit 1
          }
          trap rollback ERR

          compose pull platform-frontend
          compose up -d --no-deps platform-frontend
          container=$(compose ps -q platform-frontend)
          [ -n "$container" ] || rollback

          for attempt in $(seq 1 30); do
            if docker exec "$container" sh -c \
              'node -e '\''fetch("http://127.0.0.1:3000/api/auth/session").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'\'''; then
              break
            fi
            [ "$attempt" = 30 ] && rollback
            sleep 5
          done
          trap - ERR
          rm -f service.env.previous
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image prune -f
          REMOTE
